<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="chartGradient1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:0.3" />
    </linearGradient>
    
    <linearGradient id="chartGradient2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:0.3" />
    </linearGradient>
    
    <linearGradient id="chartGradient3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:0.3" />
    </linearGradient>
    
    <filter id="dropShadow">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="200" cy="200" r="180" fill="#f8fafc" opacity="0.5"/>
  
  <!-- Chart Background -->
  <rect x="50" y="80" width="300" height="240" rx="12" fill="white" filter="url(#dropShadow)"/>
  
  <!-- Grid Lines -->
  <g opacity="0.2">
    <line x1="70" y1="120" x2="330" y2="120" stroke="#64748b" stroke-width="1"/>
    <line x1="70" y1="180" x2="330" y2="180" stroke="#64748b" stroke-width="1"/>
    <line x1="70" y1="240" x2="330" y2="240" stroke="#64748b" stroke-width="1"/>
    <line x1="70" y1="300" x2="330" y2="300" stroke="#64748b" stroke-width="1"/>
  </g>
  
  <!-- Bar Chart -->
  <g>
    <!-- Bar 1 -->
    <rect x="80" y="200" width="35" height="100" rx="4" fill="url(#chartGradient1)">
      <animate attributeName="height" values="0;100" dur="1s" fill="freeze"/>
      <animate attributeName="y" values="300;200" dur="1s" fill="freeze"/>
    </rect>
    
    <!-- Bar 2 -->
    <rect x="130" y="160" width="35" height="140" rx="4" fill="url(#chartGradient2)">
      <animate attributeName="height" values="0;140" dur="1.2s" fill="freeze"/>
      <animate attributeName="y" values="300;160" dur="1.2s" fill="freeze"/>
    </rect>
    
    <!-- Bar 3 -->
    <rect x="180" y="180" width="35" height="120" rx="4" fill="url(#chartGradient3)">
      <animate attributeName="height" values="0;120" dur="1.4s" fill="freeze"/>
      <animate attributeName="y" values="300;180" dur="1.4s" fill="freeze"/>
    </rect>
    
    <!-- Bar 4 -->
    <rect x="230" y="140" width="35" height="160" rx="4" fill="url(#chartGradient1)">
      <animate attributeName="height" values="0;160" dur="1.6s" fill="freeze"/>
      <animate attributeName="y" values="300;140" dur="1.6s" fill="freeze"/>
    </rect>
    
    <!-- Bar 5 -->
    <rect x="280" y="120" width="35" height="180" rx="4" fill="url(#chartGradient2)">
      <animate attributeName="height" values="0;180" dur="1.8s" fill="freeze"/>
      <animate attributeName="y" values="300;120" dur="1.8s" fill="freeze"/>
    </rect>
  </g>
  
  <!-- Trend Line -->
  <path d="M 97 250 L 147 210 L 197 230 L 247 190 L 297 160" 
        stroke="#667eea" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round"
        stroke-linejoin="round"
        opacity="0.8">
    <animate attributeName="stroke-dasharray" values="0,500;500,0" dur="2s" fill="freeze"/>
  </path>
  
  <!-- Data Points -->
  <circle cx="97" cy="250" r="5" fill="#667eea">
    <animate attributeName="r" values="0;5" dur="2s" fill="freeze"/>
  </circle>
  <circle cx="147" cy="210" r="5" fill="#667eea">
    <animate attributeName="r" values="0;5" dur="2.2s" fill="freeze"/>
  </circle>
  <circle cx="197" cy="230" r="5" fill="#667eea">
    <animate attributeName="r" values="0;5" dur="2.4s" fill="freeze"/>
  </circle>
  <circle cx="247" cy="190" r="5" fill="#667eea">
    <animate attributeName="r" values="0;5" dur="2.6s" fill="freeze"/>
  </circle>
  <circle cx="297" cy="160" r="5" fill="#667eea">
    <animate attributeName="r" values="0;5" dur="2.8s" fill="freeze"/>
  </circle>
  
  <!-- Title -->
  <text x="200" y="50" font-family="Arial, sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">
    Performance Analytics
  </text>
  
  <!-- Upward Arrow Indicator -->
  <g transform="translate(320, 30)">
    <circle cx="0" cy="0" r="20" fill="#43e97b" opacity="0.2"/>
    <path d="M 0 5 L 0 -5 M -5 -2 L 0 -7 L 5 -2" 
          stroke="#43e97b" 
          stroke-width="2" 
          fill="none" 
          stroke-linecap="round"
          stroke-linejoin="round"/>
  </g>
  
  <!-- Stats Badge -->
  <g transform="translate(60, 340)">
    <rect x="0" y="0" width="280" height="40" rx="8" fill="#667eea" opacity="0.1"/>
    <text x="10" y="25" font-family="Arial, sans-serif" font-size="14" font-weight="600" fill="#667eea">
      ↑ 24% increase in efficiency
    </text>
  </g>
</svg>
