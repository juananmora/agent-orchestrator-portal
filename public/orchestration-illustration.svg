<svg width="400" height="400" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="agentGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="nodeGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="nodeGradient2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f093fb;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5576c;stop-opacity:1" />
    </linearGradient>
    
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-opacity="0.2"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <circle cx="200" cy="200" r="190" fill="#f8fafc" opacity="0.5"/>
  
  <!-- Central Agent -->
  <g transform="translate(200, 200)" filter="url(#shadow)">
    <circle cx="0" cy="0" r="50" fill="url(#agentGradient)" filter="url(#glow)">
      <animate attributeName="r" values="50;55;50" dur="3s" repeatCount="indefinite"/>
    </circle>
    
    <!-- Robot Face -->
    <circle cx="-15" cy="-10" r="6" fill="white" opacity="0.9"/>
    <circle cx="15" cy="-10" r="6" fill="white" opacity="0.9"/>
    <rect x="-12" y="8" width="24" height="6" rx="3" fill="white" opacity="0.9"/>
    
    <!-- Antenna -->
    <line x1="0" y1="-50" x2="0" y2="-70" stroke="white" stroke-width="3" opacity="0.8"/>
    <circle cx="0" cy="-70" r="5" fill="white" opacity="0.9">
      <animate attributeName="opacity" values="0.9;0.4;0.9" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Orbiting Nodes -->
  <g>
    <!-- Node 1 - Top -->
    <g transform="translate(200, 80)">
      <circle cx="0" cy="0" r="30" fill="url(#nodeGradient1)" filter="url(#shadow)">
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0 0 0"
          to="360 0 0"
          dur="20s"
          repeatCount="indefinite"/>
      </circle>
      <path d="M -8 -5 L -8 5 M 0 -5 L 0 5 M 8 -5 L 8 5" stroke="white" stroke-width="2" opacity="0.8"/>
    </g>
    
    <!-- Node 2 - Right -->
    <g transform="translate(320, 200)">
      <circle cx="0" cy="0" r="30" fill="url(#nodeGradient2)" filter="url(#shadow)">
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0 0 0"
          to="360 0 0"
          dur="25s"
          repeatCount="indefinite"/>
      </circle>
      <circle cx="0" cy="0" r="8" fill="white" opacity="0.8"/>
      <path d="M -5 0 L 5 0 M 0 -5 L 0 5" stroke="url(#nodeGradient2)" stroke-width="2"/>
    </g>
    
    <!-- Node 3 - Bottom -->
    <g transform="translate(200, 320)">
      <circle cx="0" cy="0" r="30" fill="url(#agentGradient)" filter="url(#shadow)">
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0 0 0"
          to="360 0 0"
          dur="22s"
          repeatCount="indefinite"/>
      </circle>
      <rect x="-8" y="-8" width="16" height="16" rx="2" fill="white" opacity="0.8"/>
    </g>
    
    <!-- Node 4 - Left -->
    <g transform="translate(80, 200)">
      <circle cx="0" cy="0" r="30" fill="url(#nodeGradient1)" filter="url(#shadow)">
        <animateTransform
          attributeName="transform"
          type="rotate"
          from="0 0 0"
          to="360 0 0"
          dur="18s"
          repeatCount="indefinite"/>
      </circle>
      <polygon points="0,-8 8,0 0,8 -8,0" fill="white" opacity="0.8"/>
    </g>
  </g>
  
  <!-- Connection Lines -->
  <g opacity="0.3">
    <line x1="200" y1="150" x2="200" y2="110" stroke="url(#agentGradient)" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0,100;100,0" dur="2s" repeatCount="indefinite"/>
    </line>
    <line x1="250" y1="200" x2="290" y2="200" stroke="url(#agentGradient)" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0,100;100,0" dur="2.5s" repeatCount="indefinite"/>
    </line>
    <line x1="200" y1="250" x2="200" y2="290" stroke="url(#agentGradient)" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0,100;100,0" dur="2.2s" repeatCount="indefinite"/>
    </line>
    <line x1="150" y1="200" x2="110" y2="200" stroke="url(#agentGradient)" stroke-width="2">
      <animate attributeName="stroke-dasharray" values="0,100;100,0" dur="1.8s" repeatCount="indefinite"/>
    </line>
  </g>
  
  <!-- Data Flow Particles -->
  <g>
    <circle cx="200" cy="130" r="3" fill="#4facfe">
      <animate attributeName="cy" values="130;200" dur="2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="270" cy="200" r="3" fill="#43e97b">
      <animate attributeName="cx" values="270;200" dur="2.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="200" cy="270" r="3" fill="#f093fb">
      <animate attributeName="cy" values="270;200" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="130" cy="200" r="3" fill="#00f2fe">
      <animate attributeName="cx" values="130;200" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.8s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Title -->
  <text x="200" y="30" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">
    Agent Orchestration
  </text>
  
  <!-- Status Indicators -->
  <g transform="translate(50, 360)">
    <circle cx="0" cy="0" r="4" fill="#43e97b"/>
    <text x="10" y="4" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Active</text>
    
    <circle cx="70" cy="0" r="4" fill="#4facfe"/>
    <text x="80" y="4" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Processing</text>
    
    <circle cx="160" cy="0" r="4" fill="#f093fb"/>
    <text x="170" y="4" font-family="Arial, sans-serif" font-size="12" fill="#64748b">Syncing</text>
  </g>
</svg>
