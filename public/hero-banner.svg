<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#4facfe;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00f2fe;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="successGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#43e97b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38f9d7;stop-opacity:1" />
    </linearGradient>
    
    <!-- Filters -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bgGradient)"/>
  
  <!-- Grid Pattern -->
  <g opacity="0.1">
    <line x1="0" y1="100" x2="1200" y2="100" stroke="white" stroke-width="1"/>
    <line x1="0" y1="200" x2="1200" y2="200" stroke="white" stroke-width="1"/>
    <line x1="0" y1="300" x2="1200" y2="300" stroke="white" stroke-width="1"/>
    <line x1="300" y1="0" x2="300" y2="400" stroke="white" stroke-width="1"/>
    <line x1="600" y1="0" x2="600" y2="400" stroke="white" stroke-width="1"/>
    <line x1="900" y1="0" x2="900" y2="400" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Decorative Circles -->
  <circle cx="100" cy="80" r="40" fill="url(#accentGradient)" opacity="0.3" filter="url(#glow)">
    <animate attributeName="r" values="40;50;40" dur="3s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1100" cy="320" r="60" fill="url(#successGradient)" opacity="0.3" filter="url(#glow)">
    <animate attributeName="r" values="60;70;60" dur="4s" repeatCount="indefinite"/>
  </circle>
  <circle cx="950" cy="100" r="30" fill="white" opacity="0.2">
    <animate attributeName="cy" values="100;120;100" dur="5s" repeatCount="indefinite"/>
  </circle>
  
  <!-- Network Nodes -->
  <g opacity="0.4">
    <!-- Nodes -->
    <circle cx="200" cy="200" r="8" fill="white"/>
    <circle cx="350" cy="150" r="8" fill="white"/>
    <circle cx="500" cy="250" r="8" fill="white"/>
    <circle cx="650" cy="180" r="8" fill="white"/>
    <circle cx="800" cy="220" r="8" fill="white"/>
    
    <!-- Connections -->
    <line x1="200" y1="200" x2="350" y2="150" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="350" y1="150" x2="500" y2="250" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="500" y1="250" x2="650" y2="180" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="650" y1="180" x2="800" y2="220" stroke="white" stroke-width="2" opacity="0.5"/>
    <line x1="200" y1="200" x2="500" y2="250" stroke="white" stroke-width="1" opacity="0.3"/>
  </g>
  
  <!-- Main Icon - Agent Symbol -->
  <g transform="translate(100, 150)" filter="url(#shadow)">
    <!-- Robot Head -->
    <rect x="0" y="0" width="80" height="80" rx="12" fill="white" opacity="0.95"/>
    <circle cx="25" cy="30" r="8" fill="url(#accentGradient)"/>
    <circle cx="55" cy="30" r="8" fill="url(#accentGradient)"/>
    <rect x="20" y="50" width="40" height="8" rx="4" fill="url(#successGradient)"/>
    
    <!-- Antenna -->
    <line x1="40" y1="0" x2="40" y2="-20" stroke="white" stroke-width="3" opacity="0.9"/>
    <circle cx="40" cy="-20" r="6" fill="url(#accentGradient)">
      <animate attributeName="opacity" values="1;0.5;1" dur="2s" repeatCount="indefinite"/>
    </circle>
  </g>
  
  <!-- Title Text -->
  <text x="220" y="180" font-family="Arial, sans-serif" font-size="48" font-weight="bold" fill="white" filter="url(#shadow)">
    Agent Orchestrator
  </text>
  
  <!-- Subtitle -->
  <text x="220" y="215" font-family="Arial, sans-serif" font-size="20" fill="white" opacity="0.9">
    Intelligent Automation & Analytics Platform
  </text>
  
  <!-- Feature Icons -->
  <g transform="translate(220, 250)">
    <!-- Analytics Icon -->
    <g>
      <rect x="0" y="20" width="8" height="30" rx="2" fill="white" opacity="0.8"/>
      <rect x="15" y="10" width="8" height="40" rx="2" fill="white" opacity="0.8"/>
      <rect x="30" y="15" width="8" height="35" rx="2" fill="white" opacity="0.8"/>
      <text x="50" y="35" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.9">Real-time Analytics</text>
    </g>
    
    <!-- Performance Icon -->
    <g transform="translate(250, 0)">
      <circle cx="15" cy="25" r="15" stroke="white" stroke-width="3" fill="none" opacity="0.8"/>
      <path d="M 15 10 L 15 25 L 25 25" stroke="white" stroke-width="3" fill="none" opacity="0.8"/>
      <text x="40" y="35" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.9">Performance Tracking</text>
    </g>
    
    <!-- Automation Icon -->
    <g transform="translate(520, 0)">
      <circle cx="8" cy="25" r="6" fill="white" opacity="0.8"/>
      <circle cx="28" cy="25" r="6" fill="white" opacity="0.8"/>
      <line x1="14" y1="25" x2="22" y2="25" stroke="white" stroke-width="2" opacity="0.8"/>
      <text x="40" y="35" font-family="Arial, sans-serif" font-size="14" fill="white" opacity="0.9">Smart Automation</text>
    </g>
  </g>
  
  <!-- Stats Display -->
  <g transform="translate(850, 180)">
    <rect x="0" y="0" width="300" height="150" rx="12" fill="white" opacity="0.15" filter="url(#shadow)"/>
    
    <!-- Stat 1 -->
    <text x="20" y="35" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white">94.5%</text>
    <text x="20" y="55" font-family="Arial, sans-serif" font-size="12" fill="white" opacity="0.8">Success Rate</text>
    
    <!-- Stat 2 -->
    <text x="160" y="35" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white">4,307</text>
    <text x="160" y="55" font-family="Arial, sans-serif" font-size="12" fill="white" opacity="0.8">Total Runs</text>
    
    <!-- Stat 3 -->
    <text x="20" y="100" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white">567h</text>
    <text x="20" y="120" font-family="Arial, sans-serif" font-size="12" fill="white" opacity="0.8">Time Saved</text>
    
    <!-- Stat 4 -->
    <text x="160" y="100" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white">5</text>
    <text x="160" y="120" font-family="Arial, sans-serif" font-size="12" fill="white" opacity="0.8">Active Agents</text>
  </g>
  
  <!-- Animated Pulse -->
  <circle cx="600" cy="200" r="100" fill="none" stroke="white" stroke-width="2" opacity="0">
    <animate attributeName="r" values="0;150" dur="3s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.5;0" dur="3s" repeatCount="indefinite"/>
  </circle>
</svg>
